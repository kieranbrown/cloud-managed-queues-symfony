framework:
    messenger:
        # The bundle ships a ready-made `cloud` transport that points at Laravel
        # Cloud Managed Queues (SQS via the in-container cloud-agent; SQS direct
        # locally). Which managed queue a message lands on is chosen per-message
        # with a CloudQueueStamp at dispatch; a worker picks its queue with
        # `messenger:consume cloud --queues=<name>`.
        routing:
            '*': cloud

